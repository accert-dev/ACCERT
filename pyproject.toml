[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ACCERT"
version = "2.0.0"
description = "The Algorithm for the Capital Cost Estimation of Reactor Technologies."
authors = [
    { name = "Argonne National Laboratory", email = "jia.zhou@anl.gov" }
]
readme = "README.md"
requires-python = ">=3.7"
license = { file = "LICENSE" }
dependencies = [
    "configparser",
    "matplotlib",
    "numpy>=1.26,<2.0",
    "openpyxl",
    "pandas",
    "pandoc",
    "prettytable==3.4.0",
    "scipy",
]

keywords = ["ACCERT"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/accert-dev/ACCERT"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-m 'not gui and not slow and not regression'"
markers = [
    "core: fast deterministic ACCERT, IAT, CRT, and utility tests",
    "workflow: direct IAT/CRT/ACCERT workflow integration tests",
    "gui: GUI source, server, and browser-facing behavior tests",
    "slow: computationally expensive tests excluded from the default run",
    "regression: release-level regression coverage, including broad matrices",
]
filterwarnings = [
    "ignore:datetime\\.datetime\\.utcnow\\(\\) is deprecated and scheduled for removal in a future version:DeprecationWarning:openpyxl\\.packaging\\.core",
]
